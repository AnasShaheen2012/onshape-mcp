[project]
name = "onshape-mcp-server"
dynamic = ["version"]
description = "Let Claude (or any MCP client) see, edit, render and export your Onshape CAD models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["onshape", "mcp", "mcp-server", "cad", "claude", "model-context-protocol", "frc", "ftc", "robotics", "3d-printing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/AnasShaheen2012/onshape-mcp"
Issues = "https://github.com/AnasShaheen2012/onshape-mcp/issues"

[project.scripts]
onshape-mcp-server = "onshape_mcp.server:main"
onshape-mcp = "onshape_mcp.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "onshape_mcp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
